<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapScout - Discover Images</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <div class="brand">
            <h1>SnapScout</h1>
            <p>Find visual inspiration for any idea.</p>
        </div>
    </header>

    <main class="container">

        <section class="hero">
            <h2>What are you looking for?</h2>
            <p>Search a topic and explore a world of images.</p>

            <form class="search-form">
                <label for="image-search">Search for images</label>

                <div class="search-row">
                    <input
                        type="search"
                        id="image-search"
                        placeholder="Try “mountains” or “coffee”..."
                    >

                    <button type="submit" id="search-button">
                        Search
                    </button>

                    <button type="reset" id="clear-button">
                        Clear
                    </button>
                </div>
            </form>

            <div class="quick-picks">
                <span>Quick picks:</span>
                <button type="button">Nature</button>
                <button type="button">Animals</button>
                <button type="button">Cities</button>
                <button type="button">Food</button>
            </div>
        </section>

        <section class="results-section">
            <div class="results-heading">
                <h2>Discover</h2>
                <p id="result-count">Results will appear here</p>
            </div>

            <div id="results" class="results-grid">
            </div>

            <p id="empty-state" class="empty-state">
                Search to discover images.
            </p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
